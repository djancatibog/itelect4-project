# GT6: runs on every push, to any branch.
name: CI

on: push

jobs:
  test:
    # A fresh Linux machine from GitHub. Nothing from your laptop is on it.
    runs-on: ubuntu-latest

    steps:
      # Copies this repo, at the commit that was pushed.
      - uses: actions/checkout@v7

      # Installs Node 24 and keeps npm's download cache between runs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Installs exactly what package-lock.json lists.
      - run: npm ci

      # The three test files. No secrets: vite.config.ts gives the
      # tests their own VITE_API_URL, and they never call the API.
      - run: npm test

      # tsc -b, then vite build: type errors anywhere in src/ fail
      # here, test files included. This is the type check.
      - run: npm run build